[project]
name = "docs-rag-eval"
version = "0.1.0"
description = "A lightweight RAG application with Markdown ingestion, SQLite-stored embeddings, cosine-similarity retrieval, and LLM-powered question answering."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "openai>=3.45.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
docs-rag-eval = "docs_rag_eval.api.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag_eval"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that call configured local model services"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
